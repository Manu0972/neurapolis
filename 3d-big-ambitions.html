<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURAPOLIS — Moteur 3D Style Big Ambitions</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f3f4f6;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    #ui-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 20px;
      max-width: 360px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 6px 0;
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 0.85rem;
      line-height: 1.45;
      margin: 0 0 12px 0;
      color: #9ca3af;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      font-size: 0.8rem;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .key {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      color: #f8fafc;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui-hud">
    <h1>🌇 NEURAPOLIS 3D — Big Ambitions Style</h1>
    <p>Ville 3D avec éclairage volumétrique, façades de magasins, trottoirs, véhicules et navigation isométrique.</p>
    <div class="status-badge">● Moteur 3D Actif (Val-Ferrand)</div>
    <div class="controls-grid">
      <span class="key">ZQSD / WASD</span> <span>Déplacer le personnage</span>
      <span class="key">Flèches</span> <span>Orienter la caméra 3D</span>
      <span class="key">E</span> <span>Interagir avec les commerces</span>
    </div>
  </div>
  <script type="module" src="/src/presentation/sandbox3d_bigambitions.ts"></script>
</body>
</html>
